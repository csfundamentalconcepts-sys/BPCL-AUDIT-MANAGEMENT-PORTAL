spring.application.name=audit-portal
server.port=8000

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

logging.level.org.springframework.security=DEBUG

spring.app.jwtSecret=${SPRING_APP_JWTSECRET}
spring.app.jwtExpirationMs=60000000
spring.app.jwtRefreshExpirationMs=3000000

spring.app.CHAR_POOL=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME}

azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME}
azure.servicebus.result-queue-name=${AZURE_SERVICEBUS_RESULT_QUEUE_NAME}

spring.app.frontend.url=${SPRING_APP_FRONTEND_URL}



